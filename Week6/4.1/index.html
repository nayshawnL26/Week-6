<!DOCTYPE html>
<html lang="en">
</head> 
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
       <title>CSS Transitions and Transformations</title> 
       <link rel="stylesheet" href="style.css"> 
 </head>      
 <body>

    <header>
        <h1>CSS transitions & Transformations</h1>
        <p>Move your mouse over a card to see the effect.</p> 
    </header> 
    
  <main class="card-container">
       
    <div class="card">
        <h2>Card One</h2>
        <p>This card moves upward when you hover over it</p>         
    </div>
    
    <div class="card">
        <h2>Card Two</h2>
        <p>This card grows slightly when you hover over it.</p>
    </div>

    <div class="card">
       <h2>Card Three</h2>
       <p> This card combines movement, scaling, and shadow.</p>
    </div> 
  </main> 
</body>
</html>
